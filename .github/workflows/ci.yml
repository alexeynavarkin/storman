name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC — stress + fuzz the storage layer.
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storman
          POSTGRES_PASSWORD: storman
          POSTGRES_DB: storman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storman -d storman"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build SPA and embed
        run: make build-ui

      - name: Build Go binary
        run: make build-go

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          TEST_POSTGRES_DSN: postgres://storman:storman@localhost:5432/storman?sslmode=disable
        # testpg.Pool clones a per-test database from a process-shared template
        # (internal/db/testpg/testpg.go) so packages can run in parallel.
        run: go test -race -count=1 ./...

      - name: storage coverage gate
        env:
          TEST_POSTGRES_DSN: postgres://storman:storman@localhost:5432/storman?sslmode=disable
        run: |
          # Exclude storagetest/ and archtest/ — they are test-only helpers,
          # not production storage code. check-coverage.sh filters them out of
          # the gate; instrumenting them via -coverpkg adds nothing and breaks
          # the build on stripped Go 1.25 toolchains that omit `covdata`
          # (storagetest has no _test.go files but imports `testing`).
          COVPKGS=$(go list ./internal/storage/... | grep -vE '/(storagetest|archtest)$' | paste -sd, -)
          go test -race -count=1 -coverpkg="$COVPKGS" -coverprofile=cover.out ./... >/dev/null
          scripts/check-coverage.sh cover.out 70
          go tool cover -func=cover.out | tail -1

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storman
          POSTGRES_PASSWORD: storman
          POSTGRES_DB: storman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storman -d storman"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: stress
        env:
          TEST_POSTGRES_DSN: postgres://storman:storman@localhost:5432/storman?sslmode=disable
        run: make stress STRESS_DURATION=5m

      - name: fuzz
        run: make fuzz FUZZ_TIME=2m

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: storman:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
