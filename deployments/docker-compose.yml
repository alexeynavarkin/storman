# Storman on-premise stack — Postgres + storman.
#
# All knobs live in .env in this directory. First start:
#     cp .env.example .env && chmod 600 .env && $EDITOR .env
#     docker compose up -d
#     docker compose logs storman | grep -A1 "FIRST-RUN SETUP REQUIRED"
#
# Then open http://<host>:8080/setup (or via your reverse proxy) and paste
# the one-time setup token from the logs.
#
# Storman speaks plain HTTP. Put a reverse proxy in front for TLS — STORMAN_BIND
# defaults to 127.0.0.1 so the port is reachable only from the local host.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storman}
      POSTGRES_USER: ${POSTGRES_USER:-storman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  storman:
    image: ${STORMAN_IMAGE:-alexnav/storman:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # These env vars seed config.json on first start only — after that, the
      # on-disk config is the source of truth.
      STORMAN_DB_DSN: "postgres://${POSTGRES_USER:-storman}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storman}?sslmode=disable"
      STORMAN_LISTEN_ADDR: ":8080"
      STORMAN_TRUST_PROXY: "true"
      STORMAN_SECURE_COOKIES: "true"
    volumes:
      - ./data:/var/lib/storman
    ports:
      - "${STORMAN_BIND:-127.0.0.1:8080}:8080"
    command: ["boot"]

volumes:
  pg_data:
